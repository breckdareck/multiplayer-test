[plugin]

name="Boss Attack Designer"
description="Editor dock for visually designing/debugging boss special attacks. Loads a boss's EnemyData, draws its sprite at scale, overlays the chosen BossAttackData's telegraph SHAPE using the exact runtime geometry (enemy_base._point_in_attack), shows the DASH distance, and can PLAY the windup->hit->dash sequence with the windup animation. Editor tooling only — no game launch required."
author="Internal"
version="0.1"
script="plugin.gd"
